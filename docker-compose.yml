version: "3.9"

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Connects to the PostgreSQL already running on your host machine
      # (Docker Desktop resolves host.docker.internal to the host) —
      # reuses the existing database with all data already loaded, so
      # there's no need to re-seed anything inside the container.
      DATABASE_URL: postgresql://postgres:Parvatha7@host.docker.internal:5432/visioninspect
      SECRET_KEY: change-this-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    volumes:
      - ./backend/dataset_images:/app/dataset_images
      - ./backend/model_artifacts:/app/model_artifacts
      - ./backend/uploaded_images:/app/uploaded_images
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
