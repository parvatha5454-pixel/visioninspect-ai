services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visioninspect
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visioninspect"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    network_mode: host
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/visioninspect
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

volumes:
  pgdata: